<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="terminal">
        <div class="terminal-header">
            <div class="header-brand">
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="terminal-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="terminal-title" aria-hidden="true">
                    <span class="terminal-title__user">hismar@tty1</span>
                    <span class="terminal-title__text">~/portfolio</span>
                    <span class="terminal-title__state">bash</span>
                </div>
            </div>
            <nav class="header-menu terminal-menu" id="terminal-menu" aria-label="Primary">
                <button type="button" class="menu-item" data-command="about">/about</button>
                <button type="button" class="menu-item" data-command="experience">/experience</button>
                <button type="button" class="menu-item" data-command="skills">/skills</button>
                <button type="button" class="menu-item" data-command="projects">/projects</button>
                <button type="button" class="menu-item" data-command="education">/education</button>
                <button type="button" class="menu-item" data-command="cv">/cv</button>
                <button type="button" class="menu-item" data-command="help">/help</button>
            </nav>
            <div class="header-right">
                <div class="header-social" aria-label="Social links">
                    <a href="https://github.com/ismailhaddouche" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="GitHub profile">
                        <i class="fa-brands fa-github" aria-hidden="true"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/ismail-haddouche-rhali-194305334" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="LinkedIn profile">
                        <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
                    </a>
                    <a href="mailto:ismailhaddoucherhali@gmail.com" class="social-btn" aria-label="Send email">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                    </a>
                    <button type="button" class="social-btn lang-toggle" aria-label="EN - Toggle language">
                        <span class="lang-label">EN</span>
                    </button>
                </div>
                <div class="terminal-controls">
                    <button class="control-btn control-btn--clear tooltip tooltip-bottom" data-tooltip="Clear terminal" aria-label="Clear terminal">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="menu-overlay" id="menu-overlay" aria-hidden="true"></div>

        <main class="terminal-body" id="main-content" tabindex="-1">
            <div class="console-output" id="console-output"></div>

            <div class="terminal-status" aria-hidden="true">
                <span>tty1</span>
                <span>shell: /bin/bash</span>
                <span>tab: complete</span>
                <span>esc: skip output</span>
            </div>

            <div class="input-line">
                <span class="prompt">visitor@hismar.dev:~$</span>
                <input type="text" id="command-input" autocomplete="off" spellcheck="false"
                    placeholder="Type 'help' to begin..." aria-label="Command input">
            </div>
        </main>
    </div>
